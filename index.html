<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121315">
<meta name="description" content="Safelight: a photo library and non-destructive photo editor with film looks, masks, healing and camera RAW support.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Safelight">
<title>Safelight</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<!-- artifact:start -->
<title>Safelight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: darkroom bench — catalog left, print on the easel centre, instruments right, contact strip below.
   Single deliberate dark look: neutral greys keep colour judgement honest; amber safelight is the only accent. */
:root {
  color-scheme: dark;
  --bg: #121315;
  --panel: #191a1d;
  --panel-2: #212328;
  --raise: #2a2c32;
  --line: #2c2e34;
  --fg: #d8dade;
  --muted: #8a8e97;
  --faint: #5d616a;
  --accent: #e4a54c;
  --accent-ink: #1b1306;
  --accent-soft: rgba(228,165,76,0.16);
  --danger: #e2675f;
  --ok: #8fc27a;
  --stage: #26272a;
  --f-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mark: "Instrument Serif", Georgia, serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 6px;
}
html, body { height: 100%; }
html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--raise); border-radius: 10px; border: 2px solid var(--panel); } ::-webkit-scrollbar-track { background: transparent; }

.app { display: grid; height: 100%; grid-template-columns: 248px minmax(0,1fr) 316px; grid-template-rows: 46px minmax(0,1fr) 104px;
  grid-template-areas: "top top top" "left center right" "strip strip strip"; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.mark { font: italic 23px/1 var(--f-mark); letter-spacing: 0.01em; color: var(--fg); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.mark i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); display: inline-block; }
.modes { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.modes button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; }
.modes button.on { background: var(--raise); color: var(--fg); }
.top .sp { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel-2); padding: 6px 11px; border-radius: var(--r); color: var(--fg); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--raise); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--panel-2); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.btn, .seg button, .tools button, .chip, .look, .tabbar button, .iconbtn, .li { transition: background-color .15s, color .15s, border-color .15s, transform .12s cubic-bezier(.2,.8,.2,1); touch-action: manipulation; }
.btn:active, .seg button:active, .tools button:active, .chip:active, .tabbar button:active, .iconbtn:active { transform: scale(.96); }
.look:active .lim { transform: scale(.97); }
.look .lim { transition: outline-color .2s, transform .15s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 6px); } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.enter { animation: fadeUp .26s cubic-bezier(.2,.8,.2,1) both; }

#gl { transition: opacity .22s ease; }
.stagewrap canvas.swiping { transition: none !important; }
.store-note { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.left, .right { background: var(--panel); overflow-y: auto; overflow-x: hidden; min-width: 0; }
.left { grid-area: left; border-right: 1px solid var(--line); }
.right { grid-area: right; border-left: 1px solid var(--line); }
.center { grid-area: center; position: relative; background: var(--stage); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.strip { grid-area: strip; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; }

.sec { border-bottom: 1px solid var(--line); }
.sec > h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; padding: 11px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.sec > h3 .chev { margin-left: auto; transition: transform .15s; color: var(--faint); }
.sec.closed > h3 .chev { transform: rotate(-90deg); }
.sec > .bw { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .28s cubic-bezier(.2,.8,.2,1), opacity .2s; }
.sec > .bw > .body { min-height: 0; overflow: hidden; }
.sec.closed > .bw { grid-template-rows: 0fr; opacity: 0; }
.sec > .bw > .body { transition: padding .28s cubic-bezier(.2,.8,.2,1); }
.sec.closed > .bw > .body { padding-top: 0; padding-bottom: 0; }
.sec > h3 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: none; }
.sec.mod > h3 .dot { display: inline-block; }
.sec > h3 .act { margin-left: 4px; }
.body { padding: 2px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
.sub { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 8px; }

.sl { display: grid; grid-template-columns: 92px minmax(0,1fr) 46px; align-items: center; gap: 8px; min-height: 24px; }
.sl label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
.sl.mod label { color: var(--fg); }
.sl .out { font: 12px var(--f-num); text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; background: none; border: 0; padding: 2px 0; border-radius: 4px; min-width: 0; }
.sl .out:hover { color: var(--fg); background: var(--panel-2); }
.sl.mod .out { color: var(--accent); }
.sl .num { font: 12px var(--f-num); width: 100%; text-align: right; padding: 2px 4px; }
/* custom slider track */
.trk { position: relative; height: 24px; cursor: pointer; touch-action: pan-y; outline: none; -webkit-user-select: none; user-select: none; }
.trk .rail { position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 3px; background: var(--trk, var(--raise)); }
.trk .z { position: absolute; top: 50%; width: 1px; height: 7px; margin: -3.5px 0 0 -0.5px; background: var(--faint); }
.trk .fill { position: absolute; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 3px; background: var(--fg); opacity: .55; }
.trk[style*="--trk"] .fill { opacity: 0; }
.sl.mod .trk .fill { background: var(--accent); opacity: .9; }
.trk[style*="--trk"] .fill { opacity: 0 !important; }
.trk .th { position: absolute; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 3px var(--panel), 0 1px 3px rgba(0,0,0,.5); transition: transform .18s cubic-bezier(.2,.8,.2,1), background-color .15s; }
.sl:not(.drag) .trk .th, .sl:not(.drag) .trk .fill { transition: left .26s cubic-bezier(.2,.8,.2,1), width .26s cubic-bezier(.2,.8,.2,1), transform .18s cubic-bezier(.2,.8,.2,1); }
.trk:hover .th, .trk:focus-visible .th { background: var(--accent); }
.trk:focus-visible .th { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--accent); }
.sl.drag .trk .th { transform: scale(1.35); background: var(--accent); }
.sl.drag label { color: var(--fg); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: var(--trk, var(--raise)); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: var(--trk, var(--raise)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); margin-top: -4.5px; border: 0; box-shadow: 0 0 0 3px var(--panel); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--fg); border: 0; box-shadow: 0 0 0 3px var(--panel); }
input[type=range]:hover::-webkit-slider-thumb { background: var(--accent); }
input[type=range]:hover::-moz-range-thumb { background: var(--accent); }

.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--panel-2); padding: 4px 9px; color: var(--muted); font-size: 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--raise); color: var(--fg); }
select, input[type=text], input[type=number], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 8px; min-width: 0; }
textarea { resize: vertical; width: 100%; }
.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }

/* tool strip */
.tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tools button { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); padding: 7px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 11px; }
.tools button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tools svg { width: 18px; height: 18px; }

/* histogram */
.histo { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.histo canvas { width: 100%; height: 92px; display: block; border-radius: 4px; background: var(--bg); }
.histo .meta { display: flex; justify-content: space-between; font: 11px var(--f-num); color: var(--muted); margin-top: 6px; gap: 6px; flex-wrap: wrap; }
.histo .clipb { position: relative; }
.clipdot { position: absolute; top: 6px; width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--faint); background: transparent; cursor: pointer; padding: 0; }
.clipdot.l { left: 6px; } .clipdot.r { right: 6px; }
.clipdot.on.l { background: #3b6fff; border-color: #3b6fff; } .clipdot.on.r { background: #ff4250; border-color: #ff4250; }

/* stage */
.stagebar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid rgba(0,0,0,.25); background: rgba(0,0,0,.18); min-height: 38px; flex-wrap: wrap; }
.stagebar .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
.stagebar .info { font: 11px var(--f-num); color: var(--muted); white-space: nowrap; }
.stagewrap { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.stagewrap canvas { position: absolute; left: 0; top: 0; }
#ov { pointer-events: none; }
.hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(10,10,12,.82); color: var(--fg); padding: 6px 12px; border-radius: 999px; font-size: 12px; pointer-events: none; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.badge-before { position: absolute; top: 10px; padding: 3px 8px; border-radius: 4px; background: rgba(10,10,12,.78); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; }

/* library grid */
.libbar { display: flex; gap: 8px; padding: 8px 12px; align-items: center; border-bottom: 1px solid rgba(0,0,0,.25); background: rgba(0,0,0,.18); flex-wrap: wrap; }
.libbar input[type=text] { width: 180px; }
.libbar .count { color: var(--muted); margin-left: auto; font-size: 12px; white-space: nowrap; }
.grid { flex: 1; overflow-y: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 190px), 1fr)); gap: 10px; align-content: start; }
.cell { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; cursor: default; user-select: none; position: relative; }
.cell.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cell.cur { background: var(--panel-2); }
.cell.rej .thumb img { opacity: .35; }
.thumb { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 4px; overflow: hidden; max-width: 100%; }
.thumb img { max-width: 100%; max-height: 100%; display: block; }
.cell .nm { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.cell .ft { display: flex; align-items: center; gap: 6px; min-height: 16px; }
.stars { display: inline-flex; gap: 1px; }
.stars button { background: none; border: 0; padding: 0 1px; color: var(--faint); font-size: 13px; line-height: 1; }
.stars button.on { color: var(--accent); }
.lbl { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.flag { font-size: 11px; font-weight: 600; letter-spacing: .04em; }
.flag.pick { color: var(--fg); } .flag.rej { color: var(--danger); }
.tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--raise); color: var(--muted); }
.tag.ed { background: var(--accent-soft); color: var(--accent); }

/* filmstrip */
.stripbar { display: flex; align-items: center; gap: 10px; padding: 4px 12px; font-size: 12px; color: var(--muted); min-width: 0; }
.stripbar .sp { flex: 1; }
.film { display: flex; gap: 6px; overflow-x: auto; padding: 2px 12px 8px; flex: 1; align-items: center; }
.film .fc { flex: none; height: 64px; width: 64px; border-radius: 4px; background: var(--bg); border: 2px solid transparent; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; padding: 0; position: relative; }
.film .fc img { max-width: 100%; max-height: 100%; }
.film .fc.sel { border-color: var(--faint); } .film .fc.cur { border-color: var(--accent); }
.film .fc .st { position: absolute; bottom: 1px; left: 3px; font-size: 9px; color: var(--accent); text-shadow: 0 1px 2px #000; }

/* list rows */
.list { display: flex; flex-direction: column; gap: 1px; }
.li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; cursor: pointer; color: var(--muted); min-width: 0; border: 0; background: none; text-align: left; width: 100%; }
.li:hover { background: var(--panel-2); color: var(--fg); }
.li.on { background: var(--raise); color: var(--fg); }
.li .n { margin-left: auto; font: 11px var(--f-num); color: var(--faint); }
.li .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.li .x { margin-left: 4px; opacity: 0; color: var(--faint); background: none; border: 0; padding: 0 2px; }
.li:hover .x { opacity: 1; }
.li .x:hover { color: var(--danger); }

/* curve, wheels, navigator */
.curvebox { position: relative; }
.curvebox canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 4px; background: var(--bg); touch-action: none; max-width: 100%; }
.wheels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wheel { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.wheel.big { grid-column: 1 / -1; }
.wheel canvas { width: 100%; max-width: 128px; aspect-ratio: 1; touch-action: none; }
.wheel.big canvas { max-width: 150px; }
.wheel .wl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.wheel input { width: 100%; }
.nav canvas { width: 100%; display: block; border-radius: 4px; background: var(--bg); cursor: crosshair; }

.kv { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 4px 10px; font-size: 12px; }
.kv dt { color: var(--faint); } .kv dd { margin: 0; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 3px; } .field span { color: var(--faint); font-size: 11px; }
.empty { color: var(--muted); padding: 10px 0; font-size: 12px; line-height: 1.5; }
.maskrow { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 5px; border: 1px solid transparent; cursor: pointer; }
.maskrow.on { border-color: var(--accent); background: var(--accent-soft); }
.maskrow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { background: none; border: 0; color: var(--muted); padding: 2px 4px; border-radius: 4px; }
.iconbtn:hover { color: var(--fg); background: var(--raise); }
.iconbtn.on { color: var(--accent); }

/* modal & toast */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; animation: fadeIn .18s ease both; }
.modal.out { animation: fadeIn .16s ease reverse both; }
.modal .dlg { animation: popIn .24s cubic-bezier(.2,.8,.2,1) both; }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(520px, 100%); max-height: calc(100% - 32px); overflow-y: auto; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.dlg header { padding: 16px 18px 6px; font: italic 22px var(--f-mark); }
.dlg .db { padding: 6px 18px 12px; display: flex; flex-direction: column; gap: 10px; }
.dlg footer { padding: 12px 18px 16px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); }
.dlg .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--raise); border: 1px solid var(--line); color: var(--fg); padding: 8px 14px; border-radius: 8px; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: calc(100% - 32px); animation: toastIn .28s cubic-bezier(.2,.8,.2,1) both; }
.toast.out { animation: toastOut .22s ease both; }
.drop { position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(18,19,21,.8); font: italic 26px var(--f-mark); color: var(--accent); z-index: 5; pointer-events: none; }
.busy { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(10,10,12,.85); padding: 10px 16px; border-radius: 8px; font-size: 12px; z-index: 4; }
.ptoggle { display: none; }

/* looks */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.looks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.look { position: relative; border: 0; background: none; padding: 0; display: flex; flex-direction: column; gap: 4px; text-align: left; color: var(--muted); min-width: 0; }
.look .lim { display: block; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--bg); outline: 2px solid transparent; outline-offset: 1px; }
.look .lim img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: none; }
.look .ln { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.look:hover .ln { color: var(--fg); }
.look.on .lim { outline-color: var(--accent); } .look.on .ln { color: var(--accent); }
.look .lx { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; opacity: 0; }
.look:hover .lx, .look:focus-within .lx { opacity: 1; }
